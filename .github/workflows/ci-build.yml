name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Needed so the reusable workflow can optionally delete the temp per-OS artifacts it creates.
permissions:
  contents: read
  actions: write

env:
  productNamespacePrefix: "ReactiveUI"

jobs:
  build:
    uses: reactiveui/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
    with:
      configuration: Release
      productNamespacePrefix: "ReactiveUI"
      installWorkloads: true
      installWindowsAppRuntime: true
      # Test only the test projects: the solution also builds the documentation example apps, which are not tests.
      # The device test app needs an emulator or simulator; device-tests.yml runs it.
      testProjects: |
        tests/**/*.csproj
        !tests/ReactiveUI.Device.Tests/**
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
